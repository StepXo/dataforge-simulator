[project]
name = "dataforge-simulator"
version = "0.1.0"
description = "Framework for simulating synthetic enterprise data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1,<1.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "typer>=0.16.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.scripts]
dataforge = "dataforge.cli.app:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "mypy>=1.17.1,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "ruff>=0.12.7,<1.0.0",
    "types-pyyaml>=6.0.12.20250915,<7.0.0",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
