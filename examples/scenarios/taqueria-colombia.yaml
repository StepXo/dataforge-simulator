simulation:
  seed: 42
  start_datetime: 2024-01-01T00:00:00
  end_datetime: 2024-01-31T23:00:00
  tick_unit: hour

geography:
  source: ../geography/colombia.yaml

products:
  source: ../products/taqueria.yaml

locations:
  min_per_region: 1
  max_per_region: 1
  min_capacity: 40
  max_capacity: 120
  min_activity_factor: 0.40
  max_activity_factor: 2.00

customers:
  count: 100
  mobile_preference_probability: 0.35
  inactive_probability: 0.08
  activity_profiles:
    - {name: low, weight: 0.20, monthly_rate_mean: 10, variation: 0.20, segment: occasional}
    - {name: medium, weight: 0.30, monthly_rate_mean: 15, variation: 0.20, segment: regular}
    - {name: high, weight: 0.35, monthly_rate_mean: 20, variation: 0.20, segment: frequent}
    - {name: very_high, weight: 0.15, monthly_rate_mean: 35, variation: 0.20, segment: frequent}

inventory:
  min_initial_stock: 20
  max_initial_stock: 80
  min_reorder_point: 8
  max_reorder_point: 20
  max_stock_multiplier: 1.50
  product_availability_probability: 0.80

promotions:
  count: 6
  min_duration_days: 2
  max_duration_days: 10
  min_discount_rate: 0.05
  max_discount_rate: 0.25
  min_demand_lift: 0.05
  max_demand_lift: 0.35
  mobile_only_probability: 0.20
  location_target_probability: 0.35
  region_target_probability: 0.20
  category_target_probability: 0.25

demand:
  base_demand_min: 0.05
  base_demand_max: 0.40
  weekend_factor: 1.20
  mid_month_factor: 1.10
  month_end_factor: 1.10
  early_morning_factor: 0.20
  morning_factor: 0.70
  lunch_factor: 1.40
  afternoon_factor: 0.90
  evening_factor: 1.50
  night_factor: 0.60
  max_requested_units_per_item: 100

replenishment:
  min_lead_time_days: 1
  max_lead_time_days: 3
